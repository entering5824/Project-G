[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-account-progression-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "alembic>=1.13", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["PySide6>=6.8,<7"]
desktop-build = ["PySide6>=6.8,<7", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["projectg*"]
